# Rezept-App – Betrieb in der Proxmox-LXC
#
# Image: TANDOOR_IMAGE in .env
#   - eigenes Image aus diesem Fork (Standard): deploy/build-image.sh → rezept-app:<datum>-<commit>
#   - nur zum Testen: offizielles Tandoor-Image vabene1111/recipes:2.6.15
#   (siehe projekt/UPDATE.md)
#
# Start:   cd /opt/rezept-app/deploy && docker compose up -d
# Logs:    docker compose logs -f web_recipes
# Update:  ERST Backup (deploy/backup.sh), dann neues Image bauen/eintragen und
#          docker compose up -d   (Ablauf: projekt/UPDATE.md)
#          Tandoor-Migrationen lassen sich NICHT zurückrollen!

name: rezept-app

services:
  db_recipes:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB fehlt in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web_recipes:
    image: ${TANDOOR_IMAGE:?TANDOOR_IMAGE fehlt in .env (z. B. rezept-app:aktuell)}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # DB-Verbindung immer auf den Container oben zeigen lassen
      DB_ENGINE: django.db.backends.postgresql
      POSTGRES_HOST: db_recipes
      POSTGRES_PORT: "5432"
    ports:
      # Die LXC ist nur über Tailscale erreichbar (kein Port-Forwarding im Router).
      # Port 80 der LXC → integrierter nginx im Container.
      - "${HTTP_PORT:-80}:80"
    volumes:
      - staticfiles:/opt/recipes/staticfiles
      - mediafiles:/opt/recipes/mediafiles
    depends_on:
      db_recipes:
        condition: service_healthy

volumes:
  postgres_data:
  mediafiles:
  staticfiles:
